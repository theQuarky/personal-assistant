[project]
name = "personal-assistant"
version = "0.1.0"
description = "A local-first Linux personal workload assistant with memory and LLM interaction."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
assistant = "assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
